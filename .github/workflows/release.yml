name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Compute version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build linux + windows artifacts
        env:
          VERSION: ${{ env.VERSION }}
        run: ./build.sh

      - name: Package plugin-store zips and checksums.txt
        run: ./build.sh package

      - name: Create GitHub release and upload assets
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "claude-window-anchor_${VERSION}_linux_amd64.zip" \
            "claude-window-anchor_${VERSION}_linux_arm64.zip" \
            "claude-window-anchor_${VERSION}_windows_amd64.zip" \
            checksums.txt \
            --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
