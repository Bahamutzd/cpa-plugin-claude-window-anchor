name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PLUGIN_ID: claude-window-anchor

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            ext: so
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: so
          - goos: windows
            goarch: amd64
            runner: windows-2025
            ext: dll
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve release metadata
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "LIB_NAME=${PLUGIN_ID}.${{ matrix.ext }}" >> "$GITHUB_ENV"
          echo "ARCHIVE_NAME=${PLUGIN_ID}_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" >> "$GITHUB_ENV"

      - name: Build shared library
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.goos }}/${{ matrix.goarch }}"
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -buildmode=c-shared -buildvcs=false \
              -ldflags "-s -w -X main.pluginVersion=${VERSION}" \
              -o "dist/${{ matrix.goos }}/${{ matrix.goarch }}/${LIB_NAME}" .
          rm -f "dist/${{ matrix.goos }}/${{ matrix.goarch }}/${PLUGIN_ID}.h"

      - name: Package plugin
        run: |
          set -euo pipefail
          python3 .github/scripts/package-release.py \
            --library "dist/${{ matrix.goos }}/${{ matrix.goarch }}/${LIB_NAME}" \
            --archive "${ARCHIVE_NAME}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Assemble final checksums.txt
        id: checksums
        run: |
          set -euo pipefail
          cd dist-artifacts
          ls -la
          sha256sum *.zip | sort -k2 > checksums.txt
          cat checksums.txt

      - name: Generate draft notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "# claude-window-anchor v${VERSION}"
            echo
            echo "Anchors Claude 5-hour rolling quota windows to fixed local times."
            echo
            echo "## Assets"
            echo
            echo "- \`claude-window-anchor_${VERSION}_linux_amd64.zip\`"
            echo "- \`claude-window-anchor_${VERSION}_linux_arm64.zip\`"
            echo "- \`claude-window-anchor_${VERSION}_windows_amd64.zip\`"
            echo "- \`checksums.txt\`"
          } > release-notes.md

      - name: Create GitHub release and upload assets
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ls -la dist-artifacts/
          gh release create "$GITHUB_REF_NAME" \
            "dist-artifacts/${PLUGIN_ID}_${VERSION}_linux_amd64.zip" \
            "dist-artifacts/${PLUGIN_ID}_${VERSION}_linux_arm64.zip" \
            "dist-artifacts/${PLUGIN_ID}_${VERSION}_windows_amd64.zip" \
            "dist-artifacts/checksums.txt" \
            --notes-file release-notes.md \
            --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
